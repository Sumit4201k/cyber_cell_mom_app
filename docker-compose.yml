version: "3.9"

services:
  # 1. Python AI Engine (FastAPI / INT8 Whisper / ITN / Presidio PII)
  python-service:
    build:
      context: ./python-service
      dockerfile: Dockerfile
    container_name: cybercell-python-service
    ports:
      - "8000:8000"
    environment:
      - DEVICE=cpu
      - COMPUTE_TYPE=int8
      - WHISPER_THREADS=4
      - PYTHONUNBUFFERED=1
    volumes:
      - ./python-service/data:/app/data
    restart: unless-stopped

  # 2. Node.js Express Backend API (RBAC / SHA-256 Ledger / Session Gateway)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cybercell-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - PYTHON_SERVICE_URL=http://python-service:8000
      - JWT_SECRET=cyber_cell_secret_jwt_key_2026_police
      - FIELD_ENCRYPTION_KEY=32_bytes_secret_key_for_aes256_enc!
      - AUDIO_STORAGE_PATH=./storage/audio
    volumes:
      - ./backend/data:/app/data
      - ./storage:/app/storage
    depends_on:
      - python-service
    restart: unless-stopped

  # 3. React Vite Frontend UI (Dashboard / Waveform / PII Entity Unmasking)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cybercell-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:5000/api
    depends_on:
      - backend
    restart: unless-stopped
