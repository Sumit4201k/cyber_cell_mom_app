version: "3.9"

services:
  python-service:
    build: ./python-service
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - DEVICE=cpu
      - COMPUTE_TYPE=int8
    volumes:
      - ./python-service/data:/app/data

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - PYTHON_SERVICE_URL=http://python-service:8000
      - JWT_SECRET=cyber_cell_secret_jwt_key_2026_police
      - FIELD_ENCRYPTION_KEY=32_bytes_secret_key_for_aes256_enc!
    depends_on:
      - python-service

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:5000/api
    depends_on:
      - backend

volumes:
  ollama-data:
